<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEAM 實作教師評語助手 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f4f8; }
        .dimension-card { transition: all 0.2s ease; border: 1px solid #e2e8f0; }
        .dimension-card:hover { border-color: #10b981; box-shadow: 0 4px 12px -2px rgb(16 185 129 / 0.12); }
        .preset-btn { transition: all 0.15s ease; }
        .preset-btn:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 主卡片 -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <!-- Header -->
            <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 p-6 md:p-8 text-white">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 text-xs font-bold bg-white/20 rounded-full backdrop-blur-sm">Pro 智慧語感引擎</span>
                        </div>
                        <h1 class="text-2xl md:text-3xl font-bold mt-1">🛠️ STEAM 實作評語助手</h1>
                        <p class="text-emerald-50 text-sm mt-1 opacity-90">微觀課堂行為語料庫｜上下文極性轉折銜接｜同班防撞句演算法</p>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 text-xs space-y-1 border border-white/15">
                        <div class="font-bold text-emerald-100">💡 減負小撇步</div>
                        <div>預設已停在「平穩多數派」，輸入名字可直接生成！</div>
                        <div>第 5、6 向度支援「隨機擇一」避免結尾千篇一律。</div>
                    </div>
                </div>
            </div>

            <div class="p-6 md:p-8 space-y-6">
                <!-- 姓名與快速原型列 -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                    <div class="md:col-span-4">
                        <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">學生姓名</label>
                        <input type="text" id="studentName" placeholder="輸入姓名 (如：宥廷)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-white font-medium text-base shadow-sm">
                    </div>
                    <div class="md:col-span-8">
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">⚡ 快速套用學生常見原型（一鍵切換下方選單）</label>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="applyPreset('normal')" class="preset-btn px-3 py-2 text-xs font-bold rounded-xl bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-200">
                                😐 平穩多數派 (預設安全牌)
                            </button>
                            <button onclick="applyPreset('star')" class="preset-btn px-3 py-2 text-xs font-bold rounded-xl bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200">
                                🌟 模範小創客
                            </button>
                            <button onclick="applyPreset('active')" class="preset-btn px-3 py-2 text-xs font-bold rounded-xl bg-blue-50 text-blue-800 hover:bg-blue-100 border border-blue-200">
                                ⚡ 活潑好動 (聽講需提醒)
                            </button>
                            <button onclick="applyPreset('shy')" class="preset-btn px-3 py-2 text-xs font-bold rounded-xl bg-purple-50 text-purple-800 hover:bg-purple-100 border border-purple-200">
                                🌱 慢熟細心型
                            </button>
                            <button onclick="applyPreset('maker')" class="preset-btn px-3 py-2 text-xs font-bold rounded-xl bg-rose-50 text-rose-800 hover:bg-rose-100 border border-rose-200">
                                🔧 實作強但收尾少根筋
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 6 大維度選擇區 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 1. 個性 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">1. 課堂性格與狀態</label>
                            <span class="text-[11px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md font-medium">開頭段</span>
                        </div>
                        <select id="personality" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="pos">🌟 正向：活潑開朗、充滿好奇</option>
                            <option value="neu" selected>😐 中性：溫和穩定、踏實有禮</option>
                            <option value="imp">🌱 鼓勵：慢熟內斂、較為謹慎</option>
                        </select>
                    </div>

                    <!-- 2. 聽講 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">2. 原理解說與聽講</label>
                            <span class="text-[11px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md font-medium">開頭段</span>
                        </div>
                        <select id="lecture" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="pos">🌟 正向：專注投入、積極問答</option>
                            <option value="neu" selected>😐 中性：安靜聆聽、跟上進度</option>
                            <option value="imp">🌱 鼓勵：偶爾分心、手摸零件</option>
                            <option value="warn">⚠️ 提醒：急躁插話、影響秩序</option>
                        </select>
                    </div>

                    <!-- 3. 實作 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">3. 機構組裝與實作</label>
                            <span class="text-[11px] px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-md font-medium">核心段</span>
                        </div>
                        <select id="handsOn" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="pos">🌟 正向：獨立純熟、懂排查問題</option>
                            <option value="neu" selected>😐 中性：按部就班、結構穩固</option>
                            <option value="imp">🌱 鼓勵：操作生疏、遇卡關需引導</option>
                        </select>
                    </div>

                    <!-- 4. 創作 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">4. 作品完成度與延伸</label>
                            <span class="text-[11px] px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-md font-medium">核心段</span>
                        </div>
                        <select id="creative" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="pos">🌟 正向：巧思豐富、主動改造測試</option>
                            <option value="neu" selected>😐 中性：中規中矩、功能完整達標</option>
                            <option value="imp">🌱 鼓勵：依賴範例、鼓勵大膽嘗試</option>
                            <option value="skip">➖ 略過：本次不特別提及</option>
                        </select>
                    </div>

                    <!-- 5. 社交 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">5. 同儕互動與合作</label>
                            <span class="text-[11px] px-2 py-0.5 bg-amber-50 text-amber-600 rounded-md font-medium">結尾段</span>
                        </div>
                        <select id="social" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="auto" selected>🎲 智慧調配 (與第6項隨機擇一中性)</option>
                            <option value="pos">🌟 正向：熱心助人、樂於分享交流</option>
                            <option value="neu">😐 中性：相處融洽、配合小組分工</option>
                            <option value="imp">🌱 鼓勵：習慣獨自操作、可多交流</option>
                            <option value="skip">➖ 略過：本次不特別提及</option>
                        </select>
                    </div>

                    <!-- 6. 整理 -->
                    <div class="dimension-card p-4 rounded-2xl bg-white">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-slate-700">6. 工具歸位與善後</label>
                            <span class="text-[11px] px-2 py-0.5 bg-amber-50 text-amber-600 rounded-md font-medium">結尾段</span>
                        </div>
                        <select id="cleanup" class="w-full p-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50/50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="auto" selected>🎲 智慧調配 (與第5項隨機擇一中性)</option>
                            <option value="pos">🌟 正向：主動負責、分類迅速確實</option>
                            <option value="neu">😐 中性：配合規定、收妥個人區域</option>
                            <option value="imp">🌱 鼓勵：偶爾遺漏零件、需提醒收納</option>
                            <option value="skip">➖ 略過：本次不特別提及</option>
                        </select>
                    </div>
                </div>

                <!-- 生成按鈕與結語開關 -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <button onclick="generateComment()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-4 px-6 rounded-2xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 text-lg active:scale-[0.99]">
                        ✨ 智慧合成自然評語（自動避開同班重複句）
                    </button>
                    <label class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-100 hover:bg-slate-200/70 rounded-2xl cursor-pointer select-none text-sm font-medium text-slate-700 border border-slate-200">
                        <input type="checkbox" id="addClosing" checked class="w-4 h-4 accent-emerald-600 rounded">
                        <span>加上溫馨期許結尾句</span>
                    </label>
                </div>

                <!-- 結果顯示與編輯區 -->
                <div class="relative">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <span class="text-xs font-bold text-slate-500">📝 生成結果預覽（可直接點擊框內微調文字）</span>
                        <span id="charCountBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">字數：0 字</span>
                    </div>
                    <textarea id="result" oninput="updateCharCount()" rows="5" class="w-full p-5 pb-16 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl text-slate-800 leading-relaxed resize-none focus:outline-none focus:border-emerald-500 focus:bg-white transition text-base" placeholder="點擊上方「智慧合成自然評語」按鈕後，評語將顯示於此..."></textarea>
                    
                    <div class="absolute bottom-3.5 right-3.5 flex items-center gap-2">
                        <button onclick="generateComment()" title="不滿意這組造句？點此換一批句子" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-medium py-2 px-3.5 rounded-xl transition shadow-sm text-sm flex items-center gap-1">
                            🔄 換一句試試
                        </button>
                        <button id="copyBtn" onclick="copyText()" class="bg-slate-800 hover:bg-black text-white font-bold py-2 px-5 rounded-xl transition shadow-md flex items-center gap-1.5 text-sm">
                            📋 複製並存入下方紀錄
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 歷史暫存記錄區 -->
        <div class="bg-white rounded-3xl shadow-lg overflow-hidden border border-slate-100">
            <div class="bg-slate-100/80 py-3.5 px-6 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                    <h2 class="text-slate-700 font-bold">📚 本班已生成評語暫存區</h2>
                    <span id="recordCount" class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">0 位學生</span>
                    <span class="text-xs text-slate-400 hidden sm:inline">（自動儲存於瀏覽器，重整網頁不會消失）</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="copyAllHistory()" class="text-xs font-bold bg-white hover:bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg transition shadow-sm">
                        📥 一鍵複製全班總表
                    </button>
                    <button onclick="clearHistory()" class="text-xs font-medium bg-white hover:bg-rose-50 text-rose-600 border border-slate-200 px-3 py-1.5 rounded-lg transition">
                        🗑️ 清空紀錄
                    </button>
                </div>
            </div>
            <div class="p-6">
                <div id="historyContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <p class="text-slate-400 text-sm text-center py-6" id="emptyMsg">尚未有任何記錄，按下「複製並存入下方紀錄」後會自動保存在這裡。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. 深度擴充語料庫 (每個子句皆不包含句尾句號，且開頭不強制綁定名字，由主詞與標點引擎統一調度)
         * 標記 {name} 代表可由引擎決定是否替換為名字或代名詞
         */
        const commentDb = {
            // 第一維度：課堂性格與學習狀態 (放在整段評語最開頭，必定帶出學生姓名)
            personality: {
                pos: [
                    "{name}是個充滿活力與好奇心的孩子，每次進到教室總是帶著滿滿的熱情",

                    "很喜歡{name}真誠率直且勇於嘗試的性格，在課堂互動中總是展現滿滿的活力",

                    "{name}對生活周遭的科學應用充滿好奇，上課時總是神采奕奕、十分投入",
                    "{name}有著陽光般的正向態度，即使遇到比較複雜的課堂任務也總是樂在其中",
                    "{name}在班上是個充滿朝氣的小創客，對於沒接觸過的工具與材料總是充滿探索熱情",
                    "非常肯定{name}積極主動的學習面貌，每次上課都能感受到他對科學實作的期待"
                ],
                neu: [
                    "{name}在班級中的表現相當穩定，性格溫和有禮，學習步調總是平穩踏實",

                    "很欣賞{name}穩重不浮躁的特質，每次上課都能靜下心來一步步跟上課程節奏",
                    "{name}在課堂上的情緒與狀態都很穩定，是個能讓人放心的踏實學習者",
                    "{name}待人謙和有禮，上課時的作風相當務實，能確實配合老師的各項教學引導",
                    "在近期的課程裡，{name}始終維持著平穩認真的學習狀態，態度相當端正",
                    "{name}具備良好的自我管理能力，在課堂中不疾不徐、表現得相當成熟穩重",
                    "{name}是個做事踏實、配合度高的孩子，能以穩健的步調參與每一次的科學活動",
                    "{name}在班上總是安安靜靜地做好自己的本分，展現出沉著冷靜的學習氣質",
                    "觀察{name}這陣子的上課狀態，整體表現四平八穩，面對各項任務都很有耐心",
                    "{name}的個性溫和內斂，在課堂上不吵不鬧，能穩定地投入在自己的學習節奏中",
                    "{name}上課時的態度認真且守規矩，是個行事低調但非常可靠的學生",
                    "{name}在課堂中總是保持著平和穩定的心情，能踏實地完成老師交付的每一個環節",
                    "{name}有著沉穩耐心的好脾氣，在需要花時間慢慢操作的科學課堂中表現得十分安定"
                ],
                imp: [
                    "{name}的個性較為內斂慢熟，在課堂上習慣先安靜觀察周遭的環境與變化",
                    "{name}是個心思細膩但稍微害羞的孩子，面對新的課程任務時會比較謹慎小心",
                    "{name}在班上較為安靜低調，雖然不常主動表現自己，但其實都在默默觀察學習",
                    "{name}面對陌生的實作主題時需要一點暖身時間，熟悉節奏後便能安心投入",
                    "{name}的行事風格較為保守謹慎，習慣在確認自己完全理解後才踏出下一步",
                    "{name}在團體中屬於比較害羞慢熱的類型，鼓勵未來可以試著多展現自己的想法",
                    "{name}做事細心但有時對自己比較沒把握，需要多一點鼓勵來建立課堂上的自信心",
                    "{name}在課堂上比較少主動開口，不過在逐漸適應環境後，神情已比剛開始放鬆許多",
                    "{name}是個溫和內向的孩子，習慣以自己比較熟悉、安全的步調來進行學習",
                    "{name}有時候會因為擔心做錯而顯得比較猶豫，其實只要放開來嘗試就會發現自己做得到"
                ]
            },

            // 第二維度：原理解說與聽講表現
            lecture: {
                pos: [
                    "在科學原理解說的環節十分專注，能精準抓到老師講解的核心觀念",
                    "聽講時眼神專注，不僅能快速吸收理論重點，還能針對實驗現象主動提出見解",
                    "對於作品背後的科學機制展現出濃厚興趣，在問答互動時總能給予很棒的回饋",
                    "講解步驟與原理時聽得非常仔細，常能將課堂新知與生活經驗做連結",

                    "在歸還工具與收拾環境時配合度良好，能跟著下課動線依序把器材歸位並將座椅靠好",
                    "對於個人工作區域的善後頗為負責，能按部就班地把散落的零件收好、維持桌面的基本整潔",
                    "能聽從課後的收納引導，確實做好垃圾分類與個人工具清點，展現出良好的課堂常規"
                ],
                imp: [
                    "實作過程中比較容易把零件與工具散落在桌面各處，建議養成「用完隨手歸位」的習慣才不會找不到材料",
                    "下課前偶爾會因為急著想把玩成品而忘記收拾桌面，經老師提醒後都能乖乖回來把環境復原",
                    "在將公用工具放回收納盒時偶爾會放錯格子或擺放較凌亂，多花十秒鐘對照一下分類標籤會更棒",
                    "剪裁或組裝後的細小廢料偶爾會遺留在桌面或地板上，需要再多留意周遭環境的整潔細節",
                    "收拾個人物品與材料的速度稍慢一些，建議在實作尾聲就可以先將用不到的工具分批歸位，提升收納效率"
                ]
            },

            // 溫馨期許結尾池 (依據整體表現動態挑選)
            closing: {
                general: [
                    "期待{name}在接下來的課程中繼續保持這份踏實的態度，一步步累積更多科學實作的成就感！",
                    "相信透過每一次動手做的經驗累積，{name}對於生活中的科學原理會有越來越深刻的體會，繼續加油！",
                    "很開心看到{name}在課堂中穩定成長，期待下個月的實作主題能帶給他更多動手探索的樂趣！",
                    "科學實作的魅力就在於親手把想法變成現實，期待{name}接下來也能帶著這份耐心，完成更多棒作品！",
                    "看著{name}一步一腳印地完成每次挑戰真的很替他開心，期待在未來的課堂上看到他更多自信的表現！",
                    "每一次的組裝與測試都是很棒的養分，期待{name}在下個階段的課程裡持續享受動手做科學的過程！",
                    "謝謝{name}這個月在課堂上的穩定配合與投入，期待接下來的全新主題能激發他更多對科學的好奇心！",
                    "穩健的操作習慣是成為優秀創客的重要基石，期待{name}未來持續發揮所長，在科學課堂中收穫滿滿！"
                ],
                encourage: [
                    "動手做科學本來就是一個不斷嘗試與修正的過程，相信只要多累積幾次經驗，{name}一定會越來越得心應手！",
                    "每個孩子的學習步調都不同，我們會持續在課堂上給予引導與支持，陪伴{name}一步步建立實作的自信心！",
                    "只要在課堂小細節上多加留意，相信以{name}的潛力，接下來的作品完成度與學習收穫一定會更上層樓！",
                    "期待{name}在未來的課程中能更勇敢地嘗試與發問，我們都很期待看到他慢慢展現出屬於自己的創客光芒！",
                    "透過每次課堂的練習與提醒，相信{name}能逐漸養成更成熟的學習與操作習慣，下個月我們繼續一起加油！"
                ]
            }
        };

        /**
         * 2. 上下文轉折與銜接詞庫 (避免每次連接詞都一樣)
         */
        const connectorPool = {
            // 第一段內部：個性 -> 聽講 (同向/平順)
            p1_smooth: ["，平時", "，在課堂中", "，而在上課時", "；進入課程後，", "，同時"],
            // 第一段內部：個性 -> 聽講 (正向/中性 轉 鼓勵/提醒)
            p1_contrast: ["；不過在靜態聽講時，", "，然而在原理解說階段，", "；唯獨在理論講解環節，", "，但在聽課專注度上，"],
            // 第一段內部：個性(慢熟) -> 聽講(正向/中性)
            p1_reverse_contrast: ["，不過一旦開始上課，", "，但在聽講表現上卻相當定心，", "；然而在進入原理解說後，"],

            // 第二段開頭：進入實作環節的場景轉換詞
            p2_intro: [
                "進入動手做環節後，",
                "到了實際組裝與操作的階段，",
                "在動手實作的過程中，",
                "當課程推進到機構組裝時，",
                "轉換到親手製作的時段，",
                "在實際操作器材與零件時，"
            ],
            // 當前面聽講是分心(imp)，但實作是正向/中性時的特別轉折開頭
            p2_intro_redeem: [
                "不過一旦進入動手實作的環節，",
                "然而到了實際組裝的階段，他卻能展現出穩定的一面，",
                "好在進入親手操作的時段後，注意力便能重新聚焦，"
            ],

            // 第二段內部：實作 -> 創作延伸 (順接)
            p2_to_creative_smooth: ["，而且", "，同時", "；此外，", "，在此基礎上，", "；而在作品呈現上，"],
            // 第二段內部：實作 -> 創作延伸 (轉折：實作好但創作保守，或實作慢但成品還不錯)
            p2_to_creative_contrast: ["；至於在延伸創作方面，", "，不過在自由發揮的環節，", "；而在作品的變化性上，"],

            // 第三段開頭：進入同儕與環境善後
            p3_intro: [
                "在班級相處與常規方面，",
                "至於課堂互動與生活習慣上，",
                "在團體共學的表現上，",
                "此外，在課堂常規與人際方面，",
                "在個人操作之外，"
            ],
            // 第三段內部：社交 -> 收拾 (順接/轉折)
            p3_smooth: ["，而且", "，同時", "；在課程尾聲，", "，課後也"],
            p3_contrast: ["；不過在課後善後方面，", "，唯獨在工具收納與整理時，", "；但在下課前的環境復原上，"]
        };

        /**
         * 3. 洗牌防撞抽籤袋演算法 (Shuffle Bag)
         * 確保同一班級在句子用完一輪前，絕對不會抽到重複的句子或連接詞
         */
        const shuffleBags = {};

        function drawFromBag(bagKey, sourceArray) {
            if (!sourceArray || sourceArray.length === 0) return "";
            if (!shuffleBags[bagKey] || shuffleBags[bagKey].length === 0) {
                // 複製索引陣列並進行 Fisher-Yates 洗牌
                const indices = sourceArray.map((_, idx) => idx);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                shuffleBags[bagKey] = indices;
            }
            const nextIndex = shuffleBags[bagKey].pop();
            return sourceArray[nextIndex];
        }

        // 輔助判斷極性群組：'pos' 與 'neu' 視為廣義正向/穩定(1)，'imp' 與 'warn' 視為需提醒(-1)
        function getPolarity(level) {
            if (level === 'pos' || level === 'neu') return 1;
            return -1;
        }

        /**
         * 4. 快速套用學生原型預設值
         */
        function applyPreset(type) {
            const presets = {
                normal:  { personality: 'neu', lecture: 'neu', handsOn: 'neu', creative: 'neu', social: 'auto', cleanup: 'auto' },
                star:    { personality: 'pos', lecture: 'pos', handsOn: 'pos', creative: 'pos', social: 'pos',  cleanup: 'pos' },
                active:  { personality: 'pos', lecture: 'imp', handsOn: 'pos', creative: 'neu', social: 'neu',  cleanup: 'auto' },
                shy:     { personality: 'imp', lecture: 'neu', handsOn: 'neu', creative: 'imp', social: 'auto', cleanup: 'neu' },
                maker:   { personality: 'neu', lecture: 'neu', handsOn: 'pos', creative: 'pos', social: 'skip', cleanup: 'imp' }
            };
            const target = presets[type];
            if (!target) return;
            Object.keys(target).forEach(id => {
                document.getElementById(id).value = target[id];
            });
            generateComment();
        }

        /**
         * 5. 智慧語感合成引擎 (核心邏輯)
         */
        function generateComment() {
            const rawName = document.getElementById('studentName').value.trim();
            const name = rawName !== "" ? rawName : "這位同學";

            const lvPers = document.getElementById('personality').value;
            const lvLect = document.getElementById('lecture').value;
            const lvHand = document.getElementById('handsOn').value;
            const lvCrea = document.getElementById('creative').value;
            let lvSoci   = document.getElementById('social').value;
            let lvClea   = document.getElementById('cleanup').value;

            // 處理第 5、6 向度的「🎲 智慧調配 (隨機擇一中性)」邏輯
            if (lvSoci === 'auto' && lvClea === 'auto') {
                // 隨機挑一個設為 neu，另一個設為 skip，確保全班結尾不會每個人都在擦桌子
                if (Math.random() < 0.5) {
                    lvSoci = 'neu';
                    lvClea = 'skip';
                } else {
                    lvSoci = 'skip';
                    lvClea = 'neu';
                }
            } else if (lvSoci === 'auto') {
                lvSoci = (lvClea === 'skip') ? 'neu' : 'skip';
            } else if (lvClea === 'auto') {
                lvClea = (lvSoci === 'skip') ? 'neu' : 'skip';
            }

            // --- 【第一段：個性 + 聽講】 ---
            let sPers = drawFromBag(`personality_${lvPers}`, commentDb.personality[lvPers]);
            // 第一句必定將 {name} 替換為真實學生姓名
            sPers = sPers.replace(/\{name\}/g, name);

            let sLect = drawFromBag(`lecture_${lvLect}`, commentDb.lecture[lvLect]).replace(/\{name\}/g, "");
            let p1Connector = "";
            if (lvPers === 'imp' && getPolarity(lvLect) === 1) {
                p1Connector = drawFromBag('conn_p1_rev', connectorPool.p1_reverse_contrast);
            } else if (getPolarity(lvPers) === 1 && getPolarity(lvLect) === -1) {
                p1Connector = drawFromBag('conn_p1_con', connectorPool.p1_contrast);
            } else {
                p1Connector = drawFromBag('conn_p1_smo', connectorPool.p1_smooth);
            }
            const paragraph1 = `${sPers}${p1Connector}${sLect}。`;

            // --- 【第二段：實作 + 創作延伸】 ---
            let p2Intro = "";
            if (getPolarity(lvLect) === -1 && getPolarity(lvHand) === 1) {
                p2Intro = drawFromBag('conn_p2_redeem', connectorPool.p2_intro_redeem);
            } else {
                p2Intro = drawFromBag('conn_p2_intro', connectorPool.p2_intro);
            }

            let sHand = drawFromBag(`handsOn_${lvHand}`, commentDb.handsOn[lvHand]).replace(/\{name\}/g, "");
            let paragraph2 = "";

            if (lvCrea === 'skip') {
                paragraph2 = `${p2Intro}${sHand}。`;
            } else {
                let sCrea = drawFromBag(`creative_${lvCrea}`, commentDb.creative[lvCrea]).replace(/\{name\}/g, "");
                let p2Conn = (getPolarity(lvHand) === getPolarity(lvCrea))
                    ? drawFromBag('conn_p2_smo', connectorPool.p2_to_creative_smooth)
                    : drawFromBag('conn_p2_con', connectorPool.p2_to_creative_contrast);
                paragraph2 = `${p2Intro}${sHand}${p2Conn}${sCrea}。`;
            }

            // --- 【第三段：同儕社交 + 工具整理】 ---
            let paragraph3 = "";
            if (lvSoci !== 'skip' && lvClea !== 'skip') {
                const p3Intro = drawFromBag('conn_p3_intro', connectorPool.p3_intro);
                const sSoci = drawFromBag(`social_${lvSoci}`, commentDb.social[lvSoci]).replace(/\{name\}/g, "");
                const sClea = drawFromBag(`cleanup_${lvClea}`, commentDb.cleanup[lvClea]).replace(/\{name\}/g, "");
                const p3Conn = (getPolarity(lvSoci) === 1 && getPolarity(lvClea) === -1)
                    ? drawFromBag('conn_p3_con', connectorPool.p3_contrast)
                    : drawFromBag('conn_p3_smo', connectorPool.p3_smooth);
                paragraph3 = `${p3Intro}${sSoci}${p3Conn}${sClea}。`;
            } else if (lvSoci !== 'skip') {
                const p3Intro = drawFromBag('conn_p3_intro', connectorPool.p3_intro);
                const sSoci = drawFromBag(`social_${lvSoci}`, commentDb.social[lvSoci]).replace(/\{name\}/g, "");
                paragraph3 = `${p3Intro}${sSoci}。`;
            } else if (lvClea !== 'skip') {
                const sClea = drawFromBag(`cleanup_${lvClea}`, commentDb.cleanup[lvClea]).replace(/\{name\}/g, "");
                // 單獨講整理時，用自然的時間詞帶出
                const soloCleanupIntros = ["在課程尾聲的善後環節，", "至於課後的器材整理方面，", "此外，在每次下課前的收納時間，"];
                const cIntro = drawFromBag('conn_solo_clean', soloCleanupIntros);
                paragraph3 = `${cIntro}${sClea}。`;
            }

            // --- 【第四段：溫馨期許結語 (可選)】 ---
            let paragraph4 = "";
            const needClosing = document.getElementById('addClosing').checked;
            if (needClosing) {
                // 若有超過 2 個以上的 imp/warn，選擇鼓勵型結語，否則選擇一般肯定結語
                const negCount = [lvPers, lvLect, lvHand, lvCrea, lvSoci, lvClea].filter(v => v === 'imp' || v === 'warn').length;
                const closingType = negCount >= 2 ? 'encourage' : 'general';
                let sClose = drawFromBag(`closing_${closingType}`, commentDb.closing[closingType]);
                // 結尾再次自然呼喚一次學生名字，首尾呼應
                sClose = sClose.replace(/\{name\}/g, name);
                paragraph4 = sClose;
            }

            // 組合最終文字並清理多餘標點
            let finalComment = `${paragraph1}${paragraph2}${paragraph3}${paragraph4}`;
            finalComment = finalComment.replace(/，，/g, "，").replace(/。。/g, "。");

            document.getElementById('result').value = finalComment;
            updateCharCount();
        }

        function updateCharCount() {
            const text = document.getElementById('result').value.trim();
            const len = text.length;
            const badge = document.getElementById('charCountBadge');
            badge.textContent = `字數：${len} 字`;

            if (len >= 85 && len <= 175) {
                badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800";
            } else if (len > 175) {
                badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800";
            } else {
                badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600";
            }
        }

        /**
         * 6. 剪貼簿複製與 LocalStorage 本地持久化紀錄管理
         */
        const STORAGE_KEY = 'steam_comment_history_v2';
        let historyData = {};

        function loadHistoryFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    historyData = JSON.parse(saved);
                    renderHistory();
                }
            } catch (e) {
                console.warn('無法讀取 LocalStorage 紀錄', e);
            }
        }

        function saveHistoryToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(historyData));
            } catch (e) {
                console.warn('無法寫入 LocalStorage 紀錄', e);
            }
        }

        async function copyText() {
            const resultText = document.getElementById('result');
            const comment = resultText.value.trim();

            if (!comment) {
                alert('請先點擊生成評語喔！');
                return;
            }

            try {
                await navigator.clipboard.writeText(comment);
            } catch (err) {
                resultText.select();
                document.execCommand('copy');
            }

            const nameInput = document.getElementById('studentName').value.trim();
            const studentName = nameInput !== "" ? nameInput : "未命名學生";

            historyData[studentName] = comment;
            saveHistoryToStorage();
            renderHistory();

            // 按鈕視覺回饋
            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '✅ 已複製並記錄！';
            btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            }, 1500);
        }

        async function copyAllHistory() {
            const entries = Object.entries(historyData);
            if (entries.length === 0) {
                alert('目前暫存區還沒有任何學生的記錄喔！');
                return;
            }
            const formatted = entries.map(([name, comment], idx) => `${idx + 1}. 【${name}】\n${comment}`).join('\n\n');
            try {
                await navigator.clipboard.writeText(formatted);
                alert(`已成功複製全班共 ${entries.length} 位學生的評語總表！`);
            } catch (e) {
                alert('複製失敗，請手動選取複製。');
            }
        }

        function deleteSingleHistory(name) {
            delete historyData[name];
            saveHistoryToStorage();
            renderHistory();
        }

        function clearHistory() {
            if (Object.keys(historyData).length === 0) return;
            if (confirm('確定要清空本班目前暫存的所有學生評語嗎？')) {
                historyData = {};
                saveHistoryToStorage();
                renderHistory();
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const countBadge = document.getElementById('recordCount');
            const entries = Object.entries(historyData).reverse();

            countBadge.textContent = `${entries.length} 位學生`;
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-sm text-center py-6" id="emptyMsg">尚未有任何記錄，按下「複製並存入下方紀錄」後會自動保存在這裡。</p>';
                return;
            }

            entries.forEach(([name, comment]) => {
                const item = document.createElement('div');
                item.className = "bg-slate-50 hover:bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col gap-1.5 transition group";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-emerald-800 text-sm">👤 ${name} <span class="text-xs font-normal text-slate-400 ml-1">(${comment.length}字)</span></span>
                        <button onclick="deleteSingleHistory('${name.replace(/'/g, "\\'")}')" class="text-xs text-slate-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition px-2 py-0.5 rounded">移除</button>
                    </div>
                    <div class="text-slate-600 text-xs leading-relaxed select-all">${comment}</div>
                `;
                container.appendChild(item);
            });
        }

        // 頁面載入時初始化歷史紀錄並預先生成一組範例
        window.addEventListener('DOMContentLoaded', () => {
            loadHistoryFromStorage();
        });
    </script>
