        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f2f5; }
        .dimension-card { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .dimension-card:hover { border-color: #10b981; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>

                            <option value="pos">🌟 正向：專注互動</option>
                            <option value="neu">😐 中性：安靜聽講</option>

                        </select>
                    </div>

                        <label class="block text-sm font-bold text-gray-700 mb-2">3. 課堂實作表現</label>
                        <select id="handsOn" class="w-full p-2 rounded border-gray-200 text-sm focus:ring-emerald-500">
                            <option value="pos">🌟 正向：獨立純熟</option>
                            <option value="neu">😐 中性：按部就班</option>
                            <option value="imp">🌱 鼓勵：需協助工具使用</option>
                        </select>
                    </div>

                        <label class="block text-sm font-bold text-gray-700 mb-2">4. 自由創作表現</label>
                        <select id="creative" class="w-full p-2 rounded border-gray-200 text-sm focus:ring-emerald-500">
                            <option value="pos">🌟 正向：巧思豐富</option>
                            <option value="neu">😐 中性：完成度高</option>
                            <option value="imp">🌱 鼓勵：多嘗試自身想法</option>
                        </select>
                    </div>

                        <select id="social" class="w-full p-2 rounded border-gray-200 text-sm focus:ring-emerald-500">

                        </select>

                            <option value="neu">😐 中性：配合整理</option>
                            <option value="imp">🌱 鼓勵：需提醒善後</option>

        // 儲存已生成的評語 { "小明": "評語內容..." }
        const historyData = {};

        function generateComment() {
            const name = document.getElementById('studentName').value || "這位同學";
            const dimensions = ['personality', 'lecture', 'handsOn', 'creative', 'social', 'cleanup'];
            let resultParts = [];

            dimensions.forEach(dim => {
                const level = document.getElementById(dim).value;
                const phrases = commentDb[dim][level];
                // 隨機選一句
                let phrase = phrases[Math.floor(Math.random() * phrases.length)];
                resultParts.push(phrase);
            });

            let finalComment = resultParts.join(' ');
            finalComment = finalComment.replace(/\${name}/g, name);

            document.getElementById('result').value = finalComment;
        }

        function copyText() {
            const resultText = document.getElementById('result');
            const comment = resultText.value.trim();
            
            if(!comment) {
                alert('請先點擊生成評語喔！');
                return;
            }

            // 複製到剪貼簿
            resultText.select();
            document.execCommand('copy');
            
            // 記錄到暫存區
            const nameInput = document.getElementById('studentName').value.trim();
            const studentName = nameInput !== "" ? nameInput : "未命名學生";
            
            updateHistory(studentName, comment);
            
            // 視覺回饋
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ 已複製！';
            btn.classList.add('bg-emerald-600');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-emerald-600');
            }, 1500);
        }

        function updateHistory(name, comment) {
            // 更新資料
            historyData[name] = comment;
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const emptyMsg = document.getElementById('emptyMsg');
            
            // 隱藏空訊息提示
            if(emptyMsg) emptyMsg.style.display = 'none';
            
            container.innerHTML = '';
            
            // 將物件轉為陣列並反轉，讓最新記錄在最上面 (視需求調整)
            const entries = Object.entries(historyData).reverse();

            entries.forEach(([name, comment]) => {
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-lg border border-gray-100 shadow-sm flex flex-col gap-1";
                item.innerHTML = `
                    <div class="font-bold text-emerald-800 text-sm">👤 ${name}</div>
                    <div class="text-gray-600 text-xs leading-relaxed">${comment}</div>
                `;
                container.appendChild(item);
            });
        }
    </script>
